# meeting-job per Coolify (o un qualunque docker compose) su un server
# DIVERSO da ubuntu, ma nella stessa LAN.
#
#   build: dal repo (Coolify: app "Docker Compose", compose file: docker-compose.yml,
#   Dockerfile: Containerfile). Env da impostare in Coolify:
#     MEETING_TOKEN     un bearer token (la dashboard e' pubblica, ora)
#     MISTRAL_API_KEY   la key
#     UBUNTU_HOST       l'indirizzo LAN del box che serve audio.cpp (:8090),
#                       Lemonade (:8731) e Bifrost (:8080); ${...} qui sotto e'
#                       la sostituzione standard di compose, fatta da Coolify
#                       con le variabili della UI
#
#   Il batch di default e' Mistral (voxtral diarizza via API, ovunque): un job
#   audio.cpp da quaggiu' viaggia come upload multipart, che audio.cpp regge
#   fino a ~20 minuti di registrazione e oltre va in SEGFAULT — la pipeline lo
#   rifiuta con un errore chiaro. Con un filesystem condiviso (-v ...:/asr-share
#   e --asr-dir) si torna alla modalita' path per qualunque durata.
services:
  meeting-job:
    build:
      context: .
      dockerfile: Containerfile
    image: meeting-job:latest
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      # inbox/out, jobs.json, hooks.json, gli upload con --keep-audio
      - meeting-data:/data
    # solo cio' che differisce dai default: gli endpoint sull'altro box (la
    # variabile sopra) e la scelta dei modelli. --live-asr resta vuoto: usa lo
    # stesso --asr.
    command: >-
      --dir /data
      --asr http://${UBUNTU_HOST}:8090
      --model mistral.voxtral-small-transcribe-3
      --keep-audio
      --translate-url http://${UBUNTU_HOST}:8731 --translate-model Qwen3.8-27B-GGUF
      --live-model vibevoice_asr_streaming_7b_q8_0
      --mt-gateway http://${UBUNTU_HOST}:8080
      --live-stream
volumes:
  meeting-data:
