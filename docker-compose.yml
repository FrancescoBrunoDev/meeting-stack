# meeting-job for Coolify (or any docker compose) on a server OTHER than
# ubuntu, but in the same LAN. Every deploy choice is an environment variable:
# the required ones go in the Coolify UI, the rest carry the default written
# here (standard compose syntax, ${VAR:-default}).
#
#   build: from the repo (Coolify: "Docker Compose" resource, compose file:
#   docker-compose.yml, Dockerfile: Containerfile)
#
#   Required env, set in Coolify:
#     MEETING_TOKEN     a bearer token (the dashboard is exposed now)
#     MISTRAL_API_KEY   the key
#     UNSLOTH_API_KEY   an Unsloth Studio key, for batch diarization and the
#                       unsloth.* translators
#     UBUNTU_HOST       the LAN address of the box that serves audio.cpp,
#                       Lemonade, Bifrost and Unsloth Studio
#
#   Optional env (with defaults):
#     MEETING_PORT      the service's port (8099)
#     AUDIOCPP_PORT     audio.cpp (8090)
#     BATCH_MODEL       the default transcription model
#                       (unsloth.MOSS-Transcribe-Diarize: MOSS through Unsloth
#                       Studio's transcribe workflow, with UNSLOTH_API_KEY; the
#                       studio decodes the upload and answers diarized segments,
#                       up to 4 hours. mistral.voxtral-small-transcribe-3 is the
#                       cloud alternative; a bare audio.cpp model travels as an
#                       upload here and the server SEGFAULTS past ~20 minutes of
#                       recording, so the pipeline refuses it)
#     LIVE_MODEL        the live session model (vibevoice_asr_streaming_7b_q8_0)
#     UNSLOTH_API_KEY   also the model gateway: its studio connections carry
#                       the cloud keys (Mistral, OpenCode Go) and the Lemonade
#                       models - with it set, translators of every group route
#                       through the studio and Lemonade/Bifrost are no longer
#                       addressed directly
#     TRANSLATE_MODEL   the default translator (unsloth.Hy-MT2-7B-GGUF:
#                       a translation-specialised 7B on Unsloth Studio,
#                       ~0.3s a line against ~0.6s+ for the 27B via Lemonade;
#                       Qwen3.8-27B-GGUF is the Lemonade alternative, no key)
#
#   Archive (optional): copy .env.example to .env and fill WEBDAV_URL,
#   WEBDAV_USER and WEBDAV_PASSWORD. Compose reads .env for interpolation, then
#   every received file is PUT to WebDAV/<WEBDAV_DIR>/<job>/<track>-<name> and
#   tracked in a SQLite ledger on the meeting-db volume (GET /files). Without
#   WEBDAV_URL the ledger still records the files, no copy is made.
#
#   --keep-audio and --live-stream are the service defaults; add
#   --no-keep-audio / --no-live-stream in `command` to turn them off.
services:
  meeting-job:
    build:
      context: .
      dockerfile: Containerfile
    image: meeting-job:latest
    restart: unless-stopped
    environment:
      - HOME=/data
      - MEETING_TOKEN=${MEETING_TOKEN:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - UNSLOTH_URL=http://${UBUNTU_HOST:-192.168.188.60}:8888
      - UNSLOTH_API_KEY=${UNSLOTH_API_KEY:-}
      - WEBDAV_URL=${WEBDAV_URL:-}
      - WEBDAV_USER=${WEBDAV_USER:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
      - WEBDAV_DIR=${WEBDAV_DIR:-meeting-stack}
      - ARCHIVE_DB=/db/archive.db
    ports:
      - "${MEETING_PORT:-8099}:${MEETING_PORT:-8099}"
    # GET /health answers 200 without auth; the image has no curl, python3 does.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${MEETING_PORT:-8099}/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      # inbox/out, jobs.json, hooks.json, the uploads kept by default
      - meeting-data:/data
      # the SQLite ledger: one row per received file and its WebDAV copy
      - meeting-db:/db
    # --live-asr stays empty: the live path uses the same --asr.
    command: >-
      --dir /data
      --port ${MEETING_PORT:-8099}
      --asr http://${UBUNTU_HOST:-192.168.188.60}:${AUDIOCPP_PORT:-8090}
      --model ${BATCH_MODEL:-unsloth.MOSS-Transcribe-Diarize}
      --translate-model ${TRANSLATE_MODEL:-unsloth.Hy-MT2-7B-GGUF}
      --live-model ${LIVE_MODEL:-vibevoice_asr_streaming_7b_q8_0}
volumes:
  meeting-data:
  meeting-db:
