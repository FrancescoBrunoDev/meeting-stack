# meeting-job per Coolify (o un qualunque docker compose) su un server
# DIVERSO da ubuntu, ma nella stessa LAN. Ogni scelta del deploy e' una
# variabile d'ambiente: quelle obbligatorie vanno impostate nella UI di
# Coolify, le altre hanno il default scritto qui (sintassi standard di
# compose, ${VAR:-default}).
#
#   build: dal repo (Coolify: app "Docker Compose", compose file:
#   docker-compose.yml, Dockerfile: Containerfile)
#
#   Env da impostare in Coolify:
#     MEETING_TOKEN     un bearer token (la dashboard e' pubblica, ora)
#     MISTRAL_API_KEY   la key
#     UBUNTU_HOST       l'indirizzo LAN del box che serve audio.cpp,
#                       Lemonade e Bifrost
#
#   Env facoltative (con default):
#     MEETING_PORT      porta del servizio (8099)
#     AUDIOCPP_PORT     audio.cpp (8090)
#     LEMONADE_PORT     Lemonade, il traduttore locale (8731)
#     BIFROST_PORT      il gateway dei traduttori cloud (8080)
#     BATCH_MODEL       il modello di trascrizione di default
#                       (mistral.voxtral-small-transcribe-3; da quaggiu' un
#                       modello audio.cpp viaggia come upload, e il server
#                       SEGFAULTA oltre ~20 minuti di registrazione: la
#                       pipeline lo rifiuta - mounts un --asr-dir condiviso
#                       per tornare alla modalita' path)
#     LIVE_MODEL        il modello della sessione live (vibevoice_asr_streaming_7b_q8_0)
#     TRANSLATE_MODEL   il traduttore di default (Qwen3.8-27B-GGUF)
#
#   --keep-audio e --live-stream sono i default del servizio; per toglierli
#   aggiungi --no-keep-audio / --no-live-stream in `command`.
services:
  meeting-job:
    build:
      context: .
      dockerfile: Containerfile
    image: meeting-job:latest
    restart: unless-stopped
    environment:
      - HOME=/data
    ports:
      - "${MEETING_PORT:-8099}:${MEETING_PORT:-8099}"
    volumes:
      # inbox/out, jobs.json, hooks.json, gli upload tenuti col keep-audio
      - meeting-data:/data
    # --live-asr resta vuoto: la sessione live usa lo stesso --asr.
    command: >-
      --dir /data
      --port ${MEETING_PORT:-8099}
      --asr http://${UBUNTU_HOST}:${AUDIOCPP_PORT:-8090}
      --model ${BATCH_MODEL:-mistral.voxtral-small-transcribe-3}
      --translate-url http://${UBUNTU_HOST}:${LEMONADE_PORT:-8731}
      --translate-model ${TRANSLATE_MODEL:-Qwen3.8-27B-GGUF}
      --live-model ${LIVE_MODEL:-vibevoice_asr_streaming_7b_q8_0}
      --mt-gateway http://${UBUNTU_HOST}:${BIFROST_PORT:-8080}
volumes:
  meeting-data:
